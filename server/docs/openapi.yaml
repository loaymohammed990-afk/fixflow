components:
  schemas:
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required:
        - customerName
        - phone
        - deviceType
        - deviceName
        - problem
      properties: &a4
        customerName: &a6
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          pattern: ^\+?[0-9٠-٩۰-۹]{7,15}$
          description: Arabic/Persian digits are normalized; surrounding whitespace is
            trimmed.
        deviceType: &a7
          type: string
          enum:
            - جوال
            - لابتوب
        deviceName: &a8
          type: string
          minLength: 1
          maxLength: 100
        serialNumber: &a9
          type: string
          minLength: 0
          maxLength: 100
          default: ""
        problem: &a10
          type: string
          minLength: 1
          maxLength: 2000
      example: *a3
    UpdateOrderRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties: *a4
      example:
        problem: تم فحص الشاشة
    UpdateStatusRequest:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum: *a5
    Order:
      type: object
      additionalProperties: false
      required:
        - id
        - customerName
        - phone
        - deviceType
        - deviceName
        - serialNumber
        - problem
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        customerName: *a6
        phone:
          type: string
          pattern: ^\+?[0-9]{7,15}$
        deviceType: *a7
        deviceName: *a8
        serialNumber: *a9
        problem: *a10
        status:
          type: string
          enum: *a5
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      example: *a1
    SuccessOrderResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
        data:
          $ref: "#/components/schemas/Order"
    OrdersPageResponse:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
