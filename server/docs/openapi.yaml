  /orders:
    get:
      tags:
        - Orders
      summary: بحث وتصفية وترقيم صفحات في MongoDB
      description: "Literal partial search over customerName, deviceName, phone and
        id. Arabic/Persian digits are normalized. Search AND status. Sort:
        createdAt desc, id desc. Unknown/repeated parameters are rejected.
        totalPages is 0 when empty."
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
            default: ""
        - name: status
          in: query
          schema:
            type: string
            enum:
              - ""
              - تم الاستلام
              - قيد الصيانة
              - جاهز للتسليم
              - تم التسليم
              - ملغي
            default: ""
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
