components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: fixflow.sid
      description: يحفظ المتصفح ملف الارتباط من Set-Cookie تلقائيًا.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: خذ الرمز من GET /auth/csrf وحدّثه بالرمز الجديد بعد الدخول.
  responses:
    Unauthenticated:
      description: الجلسة مفقودة أو منتهية أو مبطلة
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            success: false
            error: { code: UNAUTHENTICATED, message: يرجى تسجيل الدخول, details: [] }
    Forbidden:
      description: الصلاحية مرفوضة أو تغيير كلمة المرور مطلوب أو فشل التحقق من CSRF أو Origin
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            success: false
            error: { code: FORBIDDEN, message: ليست لديك صلاحية, details: [] }
  schemas:
    User:
      type: object
      required: [id, name, email, role, isActive, mustChangePassword]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, staff] }
        isActive: { type: boolean }
        mustChangePassword: { type: boolean }
        lastLoginAt: { type: string, format: date-time }
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required:
        - customerName
        - phone
        - deviceType
        - deviceName
        - problem
      properties: &a4
        customerName: &a6
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          pattern: ^\+?[0-9٠-٩۰-۹]{7,15}$
          description: Arabic/Persian digits are normalized; surrounding whitespace is
            trimmed.
        deviceType: &a7
          type: string
          enum:
            - جوال
            - لابتوب
        deviceName: &a8
          type: string
          minLength: 1
          maxLength: 100
        serialNumber: &a9
          type: string
          minLength: 0
          maxLength: 100
          default: ""
        problem: &a10
          type: string
          minLength: 1
          maxLength: 2000
      example: *a3
    UpdateOrderRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties: *a4
      example:
        problem: تم فحص الشاشة
    UpdateStatusRequest:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum: *a5
    Order:
      type: object
      additionalProperties: false
      required:
        - id
        - customerName
        - phone
        - deviceType
        - deviceName
        - serialNumber
        - problem
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        customerName: *a6
        phone:
          type: string
          pattern: ^\+?[0-9]{7,15}$
        deviceType: *a7
        deviceName: *a8
        serialNumber: *a9
        problem: *a10
        status:
          type: string
          enum: *a5
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      example: *a1
    SuccessOrderResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
        data:
          $ref: "#/components/schemas/Order"
    OrdersPageResponse:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        meta:
          type: object
          required:
            - page
            - limit
            - total
            - totalPages
          properties:
            page:
              type: integer
              minimum: 1
            limit:
              type: integer
              minimum: 1
              maximum: 100
            total:
              type: integer
              minimum: 0
            totalPages:
              type: integer
              minimum: 0
    DashboardSummaryResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
        data:
          type: object
          required:
            - totalOrders
            - byStatus
            - recentOrders
          properties:
            totalOrders:
              type: integer
              minimum: 0
            byStatus:
              type: object
              additionalProperties: false
              required: *a5
              properties:
                تم الاستلام:
                  type: integer
                  minimum: 0
                قيد الصيانة:
                  type: integer
                  minimum: 0
                جاهز للتسليم:
                  type: integer
                  minimum: 0
                تم التسليم:
                  type: integer
                  minimum: 0
                ملغي:
                  type: integer
                  minimum: 0
            recentOrders:
              type: array
              maxItems: 5
              items:
                $ref: "#/components/schemas/Order"
    OrderStatusesResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
        data:
          type: array
          items:
            type: string
            enum: *a5
    HealthResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
        data:
          type: object
          required:
            - service
            - database
          properties:
            service:
              type: string
            database:
              type: string
              enum:
                - connected
    ValidationErrorDetail:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              enum:
                - INVALID_QUERY
                - ORIGIN_NOT_ALLOWED
                - ORDER_NOT_FOUND
                - DUPLICATE_ORDER_ID
                - VALIDATION_ERROR
                - INTERNAL_ERROR
                - DATABASE_UNAVAILABLE
                - INVALID_ORDER_ID
                - NOT_FOUND
                - UNAUTHENTICATED
                - INVALID_CREDENTIALS
                - FORBIDDEN
                - PASSWORD_CHANGE_REQUIRED
                - INVALID_CSRF
                - TOO_MANY_ATTEMPTS
                - INVALID_CURRENT_PASSWORD
                - PASSWORD_UNCHANGED
                - DUPLICATE_EMAIL
                - INVALID_USER_ID
                - USER_NOT_FOUND
                - USER_UPDATE_IN_PROGRESS
                - LAST_ADMIN
            message:
              type: string
            details:
              type: array
              items:
                $ref: "#/components/schemas/ValidationErrorDetail"
