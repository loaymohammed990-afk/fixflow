openapi: 3.0.3
info:
  title: FixFlow Local API
  version: 1.2.0
  description: |
    تستخدم المسارات المحمية جلسة MongoDB وملف ارتباط HttpOnly باسم fixflow.sid.
    احصل على CSRF من GET /auth/csrf ثم مرّره في X-CSRF-Token عند الدخول.
    استخدم الرمز الجديد الذي يعيده تسجيل الدخول في كل عملية كتابة.
    المدير والموظف يديران الطلبات، وإلغاء الطلب أو تعديل طلب ملغى وإدارة المستخدمين للمدير.
    الحساب الذي يحتاج تغيير كلمة المرور يستطيع قراءة ملفه وتغييرها والخروج.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Auth
  - name: Users
  - name: Orders
  - name: Dashboard
  - name: Health
paths:
  /auth/csrf:
    get:
      tags: [Auth]
      summary: جلب رمز CSRF للجلسة الحالية أو بدء جلسة مجهولة
      security: []
      responses:
        "200":
          description: رمز صالح للجلسة الحالية
          headers:
            Set-Cookie:
              schema: { type: string }
              description: يُرسل عند بدء جلسة جديدة.
          content:
            application/json:
              example:
                success: true
                message: تمت العملية بنجاح
                data: { csrfToken: "<csrf-token>" }
  /auth/login:
    post:
      tags: [Auth]
      summary: تسجيل الدخول وتجديد الجلسة ورمز CSRF
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, maxLength: 1024 }
            example: { email: "admin@example.test", password: "<password>" }
      responses:
        "200":
          description: جلسة جديدة
          headers:
            Set-Cookie:
              schema: { type: string }
              description: fixflow.sid مع HttpOnly وSameSite=Lax، وSecure في الإنتاج.
          content:
            application/json:
              example:
                success: true
                message: تم تسجيل الدخول بنجاح
                data:
                  user: &safeUser
                    id: "690a1234567890abcdef1234"
                    name: مستخدم تجريبي
                    email: admin@example.test
                    role: admin
                    isActive: true
                    mustChangePassword: false
                  csrfToken: "<new-csrf-token>"
        "401":
          description: بيانات الدخول غير صحيحة أو الحساب معطّل
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                success: false
                error: { code: INVALID_CREDENTIALS, message: البريد الإلكتروني أو كلمة المرور غير صحيحة, details: [] }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429":
          description: تجاوز عشر محاولات لكل عنوان IP خلال 15 دقيقة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/me:
    get:
      tags: [Auth]
      summary: بيانات الحساب في الجلسة الحالية
      responses:
        "200": &userResponse
          description: بيانات الحساب
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      user: { $ref: "#/components/schemas/User" }
              example: { success: true, message: تمت العملية بنجاح, data: { user: *safeUser } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /auth/logout:
    post:
      tags: [Auth]
      summary: إتلاف الجلسة ومسح ملف الارتباط
      security: &sessionWrite
        - sessionCookie: []
          csrfToken: []
      requestBody: &emptyJson
        required: true
        content:
          application/json:
            schema: { type: object }
            example: {}
      responses:
        "200": { description: تم تسجيل الخروج }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/change-password:
    post:
      tags: [Auth]
      summary: تغيير كلمة المرور وإبطال كل الجلسات السابقة
      security: *sessionWrite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password, maxLength: 1024 }
                newPassword: { type: string, format: password, minLength: 12, maxLength: 1024 }
            example: { currentPassword: "<current-password>", newPassword: "<new-long-passphrase>" }
      responses:
        "200": { description: تم التغيير ويلزم تسجيل الدخول من جديد }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: كلمة المرور الحالية خاطئة أو الجديدة غير صالحة }
  /users:
    get:
      tags: [Users]
      summary: قائمة المستخدمين للمدير
      responses:
        "200":
          description: قائمة الحسابات
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { type: array, items: { $ref: "#/components/schemas/User" } }
              example: { success: true, message: تمت العملية بنجاح, data: [*safeUser] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users]
      summary: إنشاء حساب وإصدار كلمة مرور مؤقتة للمدير
      security: *sessionWrite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email]
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: string, format: email, maxLength: 254 }
                role: { type: string, enum: [admin, staff], default: staff }
            example: { name: موظف تجريبي, email: staff@example.test, role: staff }
      responses:
        "201": &temporaryResponse
          description: كلمة المرور المؤقتة في هذه الاستجابة فقط
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      user: { $ref: "#/components/schemas/User" }
                      temporaryPassword: { type: string }
              example:
                success: true
                message: تمت العملية بنجاح
                data:
                  user:
                    id: "690a1234567890abcdef1235"
                    name: موظف تجريبي
                    email: staff@example.test
                    role: staff
                    isActive: true
                    mustChangePassword: true
                  temporaryPassword: "<one-time-password>"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: البريد مستخدم بالفعل }
        "422": { description: مدخلات غير صالحة }
  /users/{id}:
    parameters:
      - &userId
        name: id
        in: path
        required: true
        schema: { type: string, pattern: "^[a-fA-F0-9]{24}$" }
    patch:
      tags: [Users]
      summary: تغيير الدور أو تفعيل الحساب أو تعطيله للمدير
      security: *sessionWrite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                role: { type: string, enum: [admin, staff] }
                isActive: { type: boolean }
            example: { isActive: false }
      responses:
        "200": *userResponse
        "400": { description: معرّف غير صالح }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: المستخدم غير موجود }
        "409": { description: آخر مدير نشط أو تعديل متزامن للحسابات }
        "422": { description: مدخلات غير صالحة }
  /users/{id}/reset-password:
    parameters: [*userId]
    post:
      tags: [Users]
      summary: إعادة ضبط كلمة المرور وإبطال الجلسات للمدير
      security: *sessionWrite
      requestBody: *emptyJson
      responses:
        "200": *temporaryResponse
        "400": { description: معرّف غير صالح }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: المستخدم غير موجود }
  /health:
    get:
      security: []
      tags:
        - Health
      summary: جاهزية قاعدة البيانات
      responses:
        "200":
          description: نجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                success: true
                message: تمت العملية بنجاح
                data:
                  service: FixFlow API
                  database: connected
        "403":
          description: مصدر الطلب غير مسموح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: ORIGIN_NOT_ALLOWED
                  message: مصدر الطلب غير مسموح
                  details: []
        "500":
          description: حدث خطأ داخلي
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INTERNAL_ERROR
                  message: حدث خطأ داخلي
                  details: []
        "503":
          description: قاعدة البيانات غير متاحة، حاول مجددًا
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: DATABASE_UNAVAILABLE
                  message: قاعدة البيانات غير متاحة، حاول مجددًا
                  details: []
  /orders/statuses:
    get:
      tags:
        - Orders
      summary: الحالات الخمس بالترتيب
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "200":
          description: نجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatusesResponse"
              example:
                success: true
                message: تمت العملية بنجاح
                data: &a5
                  - تم الاستلام
                  - قيد الصيانة
                  - جاهز للتسليم
                  - تم التسليم
                  - ملغي
        "403":
          description: مصدر الطلب غير مسموح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: ORIGIN_NOT_ALLOWED
                  message: مصدر الطلب غير مسموح
                  details: []
        "500":
          description: حدث خطأ داخلي
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INTERNAL_ERROR
                  message: حدث خطأ داخلي
                  details: []
        "503":
          description: قاعدة البيانات غير متاحة، حاول مجددًا
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: DATABASE_UNAVAILABLE
                  message: قاعدة البيانات غير متاحة، حاول مجددًا
                  details: []
  /orders:
    get:
      tags:
        - Orders
      summary: بحث وتصفية وترقيم صفحات في MongoDB
      description: "Literal partial search over customerName, deviceName, phone and
        id. Arabic/Persian digits are normalized. Search AND status. Sort:
        createdAt desc, id desc. Unknown/repeated parameters are rejected.
        totalPages is 0 when empty."
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
            default: ""
        - name: status
          in: query
          schema:
            type: string
            enum:
              - ""
              - تم الاستلام
              - قيد الصيانة
              - جاهز للتسليم
              - تم التسليم
              - ملغي
            default: ""
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "200":
          description: نجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersPageResponse"
              example:
                success: true
                message: تمت العملية بنجاح
                data:
                  - &a1
                    customerName: عميل تجريبي
                    phone: "0501234567"
                    deviceType: جوال
                    deviceName: iPhone 15
                    serialNumber: SN-DEMO
                    problem: الشاشة مكسورة
                    id: 1043
                    status: تم الاستلام
                    createdAt: 2026-11-03T10:30:00.000Z
                    updatedAt: 2026-11-03T10:30:00.000Z
                meta:
                  page: 1
                  limit: 10
                  total: 1
                  totalPages: 1
        "400":
          description: استعلام غير صالح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INVALID_QUERY
                  message: استعلام غير صالح
                  details: []
        "403":
          description: مصدر الطلب غير مسموح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: ORIGIN_NOT_ALLOWED
                  message: مصدر الطلب غير مسموح
                  details: []
        "500":
          description: حدث خطأ داخلي
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INTERNAL_ERROR
                  message: حدث خطأ داخلي
                  details: []
        "503":
          description: قاعدة البيانات غير متاحة، حاول مجددًا
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: DATABASE_UNAVAILABLE
                  message: قاعدة البيانات غير متاحة، حاول مجددًا
                  details: []
    post:
      tags:
        - Orders
      summary: إنشاء طلب
      security: *sessionWrite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example: &a3
              customerName: عميل تجريبي
              phone: "0501234567"
              deviceType: جوال
              deviceName: iPhone 15
              serialNumber: SN-DEMO
              problem: الشاشة مكسورة
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "201":
          description: نجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessOrderResponse"
              example:
                success: true
                message: تمت العملية بنجاح
                data: *a1
        "400":
          description: استعلام غير صالح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INVALID_QUERY
                  message: استعلام غير صالح
                  details: []
        "403":
          description: مصدر الطلب غير مسموح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: ORIGIN_NOT_ALLOWED
                  message: مصدر الطلب غير مسموح
                  details: []
        "409":
          description: رقم الطلب موجود بالفعل
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: DUPLICATE_ORDER_ID
                  message: رقم الطلب موجود بالفعل
                  details: []
        "413":
          description: حجم البيانات أكبر من المسموح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: حجم البيانات أكبر من المسموح
                  details: []
        "415":
          description: استخدم application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: استخدم application/json
                  details: []
        "422":
          description: يرجى تصحيح البيانات المدخلة
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: يرجى تصحيح البيانات المدخلة
                  details:
                    - field: phone
                      message: أدخل رقم هاتف صحيحًا من 7 إلى 15 رقمًا
        "500":
          description: حدث خطأ داخلي
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INTERNAL_ERROR
                  message: حدث خطأ داخلي
                  details: []
        "503":
          description: قاعدة البيانات غير متاحة، حاول مجددًا
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: DATABASE_UNAVAILABLE
                  message: قاعدة البيانات غير متاحة، حاول مجددًا
                  details: []
  /orders/{id}:
    parameters:
      - &a2
        name: id
        in: path
        required: true
        description: رقم الطلب العددي، وليس MongoDB ObjectId
        schema:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        example: 1042
    get:
      tags:
        - Orders
      summary: تفاصيل طلب
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "200":
          description: نجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessOrderResponse"
              example:
                success: true
                message: تمت العملية بنجاح
                data: *a1
        "400":
          description: رقم الطلب غير صالح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INVALID_ORDER_ID
                  message: رقم الطلب غير صالح
                  details: []
        "403":
          description: مصدر الطلب غير مسموح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: ORIGIN_NOT_ALLOWED
                  message: مصدر الطلب غير مسموح
                  details: []
        "404":
          description: الطلب غير موجود
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: ORDER_NOT_FOUND
                  message: الطلب غير موجود
                  details: []
        "500":
          description: حدث خطأ داخلي
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INTERNAL_ERROR
                  message: حدث خطأ داخلي
                  details: []
        "503":
          description: قاعدة البيانات غير متاحة، حاول مجددًا
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: DATABASE_UNAVAILABLE
                  message: قاعدة البيانات غير متاحة، حاول مجددًا
                  details: []
    patch:
      tags:
        - Orders
      summary: تعديل الحقول الستة فقط
      security: *sessionWrite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderRequest"
            example:
              problem: تم فحص الشاشة
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "200":
          description: نجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessOrderResponse"
              example:
                success: true
                message: تمت العملية بنجاح
                data:
                  customerName: عميل تجريبي
                  phone: "0501234567"
                  deviceType: جوال
                  deviceName: iPhone 15
                  serialNumber: SN-DEMO
                  problem: تم فحص الشاشة
                  id: 1043
                  status: تم الاستلام
                  createdAt: 2026-11-03T10:30:00.000Z
                  updatedAt: 2026-11-03T10:30:00.000Z
        "400":
          description: رقم الطلب غير صالح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INVALID_ORDER_ID
                  message: رقم الطلب غير صالح
                  details: []
        "403":
          description: مصدر الطلب غير مسموح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: ORIGIN_NOT_ALLOWED
                  message: مصدر الطلب غير مسموح
                  details: []
        "404":
          description: الطلب غير موجود
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: ORDER_NOT_FOUND
                  message: الطلب غير موجود
                  details: []
        "413":
          description: حجم البيانات أكبر من المسموح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: VALIDATION_ERROR
